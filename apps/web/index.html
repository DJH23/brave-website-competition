<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy‑First Creator Hub</title>
    <meta name="description"
        content="A Brave-inspired, privacy-first creator hub with BAT tipping, interactive demos, and a modern Vue 3 + Vite experience." />
    <meta name="theme-color" content="#0F0F11" />

    <!-- DNS Prefetch and Preconnect for external resources -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Privacy‑First Creator Hub" />
    <meta property="og:description"
        content="A Brave-inspired, privacy-first creator hub with BAT tipping, interactive demos, and a modern Vue 3 + Vite experience." />
    <meta property="og:image" content="/social-card.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy‑First Creator Hub" />
    <meta name="twitter:description"
        content="A Brave-inspired, privacy-first creator hub with BAT tipping, interactive demos, and a modern Vue 3 + Vite experience." />
    <meta name="twitter:image" content="/social-card.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Privacy‑First Creator Hub",
            "about": "Privacy-first portfolio, interactive demos, and BAT integration.",
            "inLanguage": "en"
        }
        </script>
</head>

<body class="min-h-screen bg-neutral-950 text-white bg-brave-gradient bg-fixed bg-cover">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
